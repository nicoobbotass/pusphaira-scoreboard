<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f4a37">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Pusphaira Scoreboard</title>
<style>
  /* ---------- Touchline — coach's tactics board ---------- */
  :root{
    --turf:#1f4a37; --turf-2:#183b2c; --turf-hi:#2f6650; --turf-lo:#132a20;
    --chalk:#f4f7f2; --chalk-dim:#c6d6cc;
    --field:#16261d;
    --sheet:#eae6d9; --sheet-ink:#1b2a22;
    --flag:#f2c12e; --flag-ink:#20180a;
    --redcard:#d23b2f;
    --gblue:#2f6bff; --gblue-l:#8ab4ff; --gred:#ff3b3b; --gred-l:#ff9a9a;
    --ggreen:#28c76f;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --lift:0 2px 6px rgba(0,0,0,.38);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0; padding:0}
  body{
    background:radial-gradient(130% 90% at 50% -10%, #25563f 0%, #1c402f 60%, #173525 100%) fixed, var(--turf);
    color:var(--chalk);
    font:16px/1.5 var(--sans);
    padding-top:var(--safe-t);
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
    min-height:100vh;
  }
  h1,h2,h3{
    margin:0 0 .4em; font-family:var(--sans); font-weight:700;
    letter-spacing:0; line-height:1.12; color:var(--chalk);
  }
  button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
  input[type=text],input[type=number],input[type=date]{
    font:inherit; color:var(--chalk); background:var(--field);
    border:1px solid var(--turf-hi); border-radius:6px; padding:.55em .7em; width:100%;
    -webkit-user-select:text; user-select:text; caret-color:var(--flag);
  }
  input[type=date]{ text-align:center; -webkit-appearance:none; appearance:none; min-height:2.6em }
  input[type=date]::-webkit-date-and-time-value{ text-align:center; width:100%; margin:0 }
  input[type=date]::-webkit-datetime-edit{ text-align:center; width:100%; padding:0 }
  input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(1) opacity(.55) }
  input:focus{outline:2px solid var(--flag); outline-offset:1px}

  .page{max-width:760px; margin:0 auto; padding:16px 15px 96px; position:relative}
  .bar{display:flex; align-items:baseline; gap:10px; margin-bottom:18px; flex-wrap:wrap}
  .bar h1{font-size:27px; margin:0; flex:1}
  .btn{
    background:transparent; border:1px solid var(--chalk-dim); border-radius:999px;
    padding:.55em 1em; font-family:var(--sans); font-weight:600; font-size:14px;
    display:inline-flex; align-items:center; gap:.4em; color:var(--chalk);
    transition:opacity .1s ease, transform .04s ease;
  }
  .btn:active{transform:translateY(1px); opacity:.8}
  .btn.pri{background:var(--flag); border-color:var(--flag); color:var(--flag-ink); font-weight:700}
  .btn.ghost{background:rgba(255,255,255,.04); border-color:var(--turf-hi); color:var(--chalk)}
  .btn.sm{padding:.4em .8em; font-size:12px}
  .btn.danger{color:var(--redcard); border-color:color-mix(in srgb,var(--redcard) 45%, transparent)}
  select.btn{background:var(--turf-lo); border-color:var(--turf-hi); color:var(--chalk)}
  .row{display:flex; gap:8px; align-items:center}
  .row.wrap{flex-wrap:wrap}
  .spacer{flex:1}
  .muted{color:var(--chalk-dim)}
  .small{font-size:13px}
  .card{
    background:rgba(255,255,255,.045); border:1px solid var(--turf-hi); border-radius:8px;
    padding:16px; margin-bottom:16px;
  }
  .pill{
    border:1px solid var(--chalk-dim); border-radius:999px; padding:.32em .85em;
    font-family:var(--sans); font-weight:600; font-size:12px;
    background:transparent; color:var(--chalk-dim);
  }
  .pill.on{background:var(--flag); color:var(--flag-ink); border-color:var(--flag)}
  #egToggle.on{background:var(--redcard); color:#fff; border-color:var(--redcard)}

  /* scoreboard — magnet discs carrying flip-board tiles */
  .teams{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px}
  .team{
    position:relative; text-align:center; perspective:600px;
    padding:14px 10px 12px; border-radius:16px;
    border:2px solid color-mix(in srgb, var(--tc,#888) 65%, #000);
    background:
      radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--tc,#888) 42%, var(--turf-lo)), color-mix(in srgb, var(--tc,#888) 20%, var(--turf-lo)));
    box-shadow:var(--lift), inset 0 1px 0 rgba(255,255,255,.16);
    min-height:132px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
  }
  .team .name{font-family:var(--sans); font-weight:700; font-size:14px; letter-spacing:0; color:var(--chalk); word-break:break-word}
  .team .score{
    font-family:var(--sans); font-weight:800; font-size:52px; line-height:1;
    font-variant-numeric:tabular-nums; color:var(--chalk);
    margin:6px auto 4px; padding:.06em .26em; min-width:1.7em;
    background:var(--turf-lo); border-radius:6px;
    box-shadow:inset 0 3px 7px rgba(0,0,0,.55);
  }
  .team .score::after{                                   /* split-flap seam */
    content:""; position:absolute; left:0; right:0; top:50%;
    height:2px; background:rgba(0,0,0,.4); transform:translateY(-1px);
  }
  .team .score{position:relative}
  .team .score.bump{animation:flap .18s ease-out}
  @keyframes flap{0%{transform:rotateX(-88deg)}60%{transform:rotateX(7deg)}100%{transform:rotateX(0)}}
  @media (prefers-reduced-motion:reduce){ .team .score.bump{animation:none} }
  .viewonly .team{cursor:default}
  body:not(.viewonly) .team:active .score{filter:brightness(1.28)}   /* tap feedback on the tile */
  .team .minus{
    position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:999px;
    background:var(--turf-lo); border:1px solid var(--turf-hi); color:var(--chalk); font-weight:700; font-size:18px;
    box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .team.win{border-color:var(--flag); box-shadow:0 0 0 3px color-mix(in srgb,var(--flag) 50%, transparent), var(--lift)}
  .team.win .score{box-shadow:inset 0 3px 7px rgba(0,0,0,.55), 0 0 0 2px var(--flag)}
  .team .crown{position:absolute; top:6px; left:8px; font-size:16px}

  /* lists — teamsheet / ladder rows ruled on the board */
  .list{display:flex; flex-direction:column}
  .item{display:flex; align-items:center; gap:10px; padding:12px 6px; background:transparent;
    border:0; border-bottom:1px solid var(--turf-hi); border-radius:0}
  .list .item:last-child{border-bottom:0}
  .item .grow{flex:1; min-width:0}
  .item .nm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .nm[data-player]{text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; text-decoration-color:var(--turf-hi)}
  .rank{width:30px; text-align:center; font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; color:var(--chalk)}
  .list .item:first-child .rank{background:var(--flag); color:var(--flag-ink); border-radius:4px; padding:2px 0}
  .num{font-variant-numeric:tabular-nums; font-weight:700}
  .col{width:64px; text-align:right; flex:none; font-variant-numeric:tabular-nums}
  .col.num{color:var(--chalk-dim); font-weight:600}
  .col.num.hi{color:var(--chalk); font-weight:800; font-size:18px}
  .delta{color:#9bd9a8; font-size:13px; margin-left:4px}
  .mv{font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; margin-left:6px}
  .mv.up{color:#7fd694}  .mv.dn{color:#ff9a8a}  .mv.flat{color:var(--chalk-dim)}
  .att{font-size:12px; color:var(--chalk-dim); font-variant-numeric:tabular-nums; margin-left:6px; font-weight:600}
  .chip.away{opacity:.5; border-style:dashed}
  .pcgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:9px; margin-bottom:12px}
  .pcstat{background:rgba(255,255,255,.04); border:1px solid var(--turf-hi); border-radius:8px; padding:10px 11px}
  .pcv{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--chalk)}
  .pcsub{font-size:12px; font-weight:600; color:var(--chalk-dim)}
  .pcl{font-size:11px; color:var(--chalk-dim); margin-top:3px}
  .spark{margin:2px 0 6px}
  .sparksvg{width:100%; height:54px; display:block}

  /* nav — board strip, active tab marked with a magnet clip */
  .nav{
    position:fixed; left:0; right:0; bottom:0; display:flex; z-index:20;
    background:var(--turf-2); border-top:1px solid var(--turf-hi);
    padding-bottom:var(--safe-b);
  }
  .nav button{flex:1; padding:9px 4px 8px; font-family:var(--sans); font-weight:600; font-size:11px; letter-spacing:0; color:var(--chalk-dim); display:flex; flex-direction:column; align-items:center; gap:3px; position:relative}
  .nav button .ic{display:flex; opacity:.7}
  .nav button .ic svg{width:21px; height:21px; display:block}
  .nav button.on{color:var(--chalk)}
  .nav button.on .ic{opacity:1}
  .nav button.on::after{content:""; position:absolute; top:0; left:22%; right:22%; height:3px; background:var(--flag)}

  /* modal */
  .scrim{position:fixed; inset:0; background:rgba(8,18,13,.62); display:flex; align-items:flex-end; justify-content:center; z-index:40}
  .sheet{background:var(--turf); width:100%; max-width:760px; border-radius:16px 16px 0 0;
    border:1px solid var(--turf-hi); border-bottom:0;
    box-shadow:0 -10px 34px rgba(0,0,0,.5);
    padding:18px; padding-bottom:calc(18px + var(--safe-b)); max-height:88vh; overflow:auto}
  .sheet h2{font-size:20px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{border:1px solid var(--turf-hi); border-radius:999px; padding:.4em .85em; font-family:var(--sans); font-weight:600; font-size:13px; background:rgba(255,255,255,.05); color:var(--chalk)}
  .chip.on{background:var(--flag); color:var(--flag-ink); border-color:var(--flag)}
  .chip.dim{opacity:.4}
  .hr{height:0; border-top:1px solid var(--turf-hi); margin:14px 0}
  .warnbar{background:color-mix(in srgb,var(--redcard) 20%, var(--turf)); border:1px solid var(--redcard); color:var(--chalk);
    padding:9px 12px; border-radius:6px; margin-bottom:14px; font-size:14px}
  .tag{font-family:var(--sans); font-size:11px; padding:.16em .5em; border-radius:3px;
    background:var(--redcard); color:#fff; font-weight:700; letter-spacing:.02em}

  /* ---------- mode switch ---------- */
  .modebar{display:flex; align-items:center; gap:10px; justify-content:center; margin:-2px 0 14px; font-size:12px; font-weight:600; color:var(--chalk-dim); cursor:pointer}
  .modebar .lit{color:var(--chalk)}
  .switch{width:46px; height:27px; border-radius:999px; background:var(--turf-lo); border:1px solid var(--turf-hi); padding:2px; flex:none; transition:background .15s; cursor:pointer}
  .switch .knob{display:block; width:21px; height:21px; border-radius:50%; background:var(--chalk); transition:transform .16s ease}
  .switch.on{background:var(--ggreen); border-color:var(--ggreen)}
  .switch.on .knob{transform:translateX(19px)}
  .switch.small{width:40px; height:24px}
  .switch.small .knob{width:18px; height:18px}
  .switch.small.on .knob{transform:translateX(16px)}

  /* ---------- game mode ---------- */
  body.gamemode .nav{display:none}
  body.gamemode #app{padding:0; max-width:none}
  .gamewrap{display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; padding-bottom:var(--safe-b)}
  .gamewrap > .modebar{flex:0 0 auto; margin:0; padding:9px 0 7px; background:var(--turf-2); border-bottom:1px solid var(--turf-hi)}
  .gdiscard{position:absolute; left:12px; top:14px; z-index:1; font-size:12px; font-weight:700; color:var(--gred-l);
    border:1px solid color-mix(in srgb, var(--gred) 45%, transparent); border-radius:999px; padding:.28em .85em; background:rgba(0,0,0,.18)}
  .gdiscard:active{filter:brightness(1.2)}
  .clockbar{flex:0 0 auto; position:relative; text-align:center; padding:10px 14px 12px;
    background:var(--turf-2); border-bottom:1px solid var(--turf-hi)}
  .clockmain{display:flex; align-items:baseline; justify-content:center; gap:10px;
    font-variant-numeric:tabular-nums; font-weight:800; font-size:44px; line-height:1; letter-spacing:.02em; color:var(--chalk)}
  .stoppage{display:inline-block; max-width:170px; overflow:hidden; white-space:nowrap;
    font-size:22px; font-weight:700; color:var(--flag)}
  .stoppage.leaving{animation:stoppageOut .36s ease forwards}
  @keyframes stoppageOut{to{opacity:0; transform:translateX(14px) scale(.75); max-width:0; margin-left:-10px}}
  .teamrow{display:flex; justify-content:space-between; margin-top:7px; font-weight:700; font-size:13px}
  .teamrow .home{color:var(--gblue-l)}  .teamrow .away{color:var(--gred-l)}
  .teamrow b{font-size:16px; margin:0 3px}

  .gamemain{flex:1 1 auto; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px; overflow-y:auto}
  .gside{display:flex; flex-direction:column; gap:8px}
  .gbtn{flex:1; min-height:46px; border-radius:10px; color:#fff; font-weight:800; font-size:16px; letter-spacing:.02em; border:2px solid transparent}
  .gside.home .gbtn{background:color-mix(in srgb, var(--gblue) 80%, #000); border-color:color-mix(in srgb, var(--gblue) 55%, #fff)}
  .gside.away .gbtn{background:color-mix(in srgb, var(--gred) 72%, #000); border-color:color-mix(in srgb, var(--gred) 50%, #fff)}
  .gbtn:active{filter:brightness(1.3)}

  .undo{flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:10px; padding:6px 10px; font-size:12px; color:var(--chalk-dim)}
  .undo button{border:1px solid var(--turf-hi); border-radius:999px; padding:.3em .85em; color:var(--chalk); font-weight:600}

  .control{flex:0 0 auto; margin:10px; padding:.95em; border-radius:12px; border:0; font-weight:800; font-size:18px; letter-spacing:.03em; color:#04140b}
  .control.green{background:var(--ggreen)}
  .control.amber{background:var(--flag); color:#20180a}
  .control.red{background:var(--gred); color:#fff}
  .control.grey{background:var(--turf-hi); color:var(--chalk)}
  .control:active{filter:brightness(1.09)}

  .gcenter{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:5px; padding:22px}
  .gcenter .home-l{color:var(--gblue-l)}  .gcenter .away-l{color:var(--gred-l)}

  .descwrap{flex:1 1 auto; display:flex; flex-direction:column; min-height:0}
  .deschead{padding:12px 14px; font-weight:800; font-size:17px; letter-spacing:.02em}
  .deschead.home{background:color-mix(in srgb, var(--gblue) 30%, var(--turf)); color:#cfe0ff}
  .deschead.away{background:color-mix(in srgb, var(--gred) 26%, var(--turf)); color:#ffd6d6}
  .descgrid{flex:0 1 auto; min-height:0; margin:auto 0; display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:14px; overflow-y:auto}
  .descchip{flex:0 0 auto; min-width:150px; min-height:54px; display:flex; align-items:center; justify-content:center; text-align:center;
    border:2px solid var(--turf-hi); border-radius:10px; padding:.7em 1em; background:rgba(255,255,255,.04); color:var(--chalk); font-weight:700; font-size:14px}
  .descchip.on{background:var(--flag); color:var(--flag-ink); border-color:var(--flag)}
  .descchip:active{filter:brightness(1.15)}
  .descrow{flex:0 0 auto; padding:8px 12px 0}
  .descrow select, .descrow input{width:100%}
  .descfoot{flex:0 0 auto; display:grid; grid-template-columns:1fr 2fr; gap:8px; padding:10px}
  .descfoot .control{margin:0}

  .report{flex:1 1 auto; overflow-y:auto; padding:16px}
  .rscore{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px; text-align:center; font-weight:800; font-size:16px}
  .rscore .home{color:var(--gblue-l)}  .rscore .away{color:var(--gred-l)}
  .rscore b{font-size:34px; font-variant-numeric:tabular-nums; color:var(--chalk)}
  .rtally{margin:14px 0}
  .trow{display:flex; align-items:center; padding:7px 0; border-bottom:1px solid var(--turf-hi)}
  .trow .tv{width:64px; text-align:center; font-weight:800; font-variant-numeric:tabular-nums}
  .trow .tv.home{color:var(--gblue-l)}  .trow .tv.away{color:var(--gred-l)}
  .trow .tl{flex:1; text-align:center; color:var(--chalk-dim); font-size:13px}
  .tline{display:flex; flex-direction:column; gap:2px}
  .tev{display:grid; grid-template-columns:auto auto 1fr; gap:8px; align-items:baseline; padding:6px 8px; border-left:3px solid transparent; font-size:13px}
  .tev.home{border-left-color:var(--gblue)}  .tev.away{border-left-color:var(--gred)}
  .tev .tt{font-variant-numeric:tabular-nums; color:var(--chalk-dim); font-weight:700}
  .tev .ta{font-weight:700}
  .tev .td{color:var(--chalk-dim)}

  /* password gate */
  #gate{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    padding:24px; background:radial-gradient(130% 90% at 50% -10%, #25563f, #1c402f 60%, #142f21)}
  .gatebox{width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px;
    background:rgba(255,255,255,.05); border:1px solid var(--turf-hi); border-radius:12px; padding:22px}
  .gatebox .gmark{font-weight:800; letter-spacing:.5px; color:var(--flag)}
  .gatebox h2{margin:0; font-size:20px}
  .gatebox p{margin:0}
  .gatebox input{margin-top:2px}
  .gatebox .btn{width:100%; justify-content:center}
</style>
</head>
<body>
<div class="page" id="app"></div>

<div class="nav" id="nav">
  <button data-go="now"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 13V8.5M9.5 3h5M18.6 5.6l1.2 1.2"/></svg></span>Now</button>
  <button data-go="exercises"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4M9 10h6M9 14h6M9 18h4"/></svg></span>Exercises</button>
  <button data-go="players"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.2 20c0-3.3 2.9-5.3 5.8-5.3s5.8 2 5.8 5.3"/><path d="M16.4 6.2a2.9 2.9 0 0 1 0 5.6M16.5 15.2c2.6.3 4.8 2.2 4.8 4.8"/></svg></span>Players</button>
  <button data-go="standings"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v3.5a5 5 0 0 1-10 0Z"/><path d="M7 5.5H4.2v1A3.2 3.2 0 0 0 7 9.7M17 5.5h2.8v1A3.2 3.2 0 0 1 17 9.7M9.6 14.5h4.8M9 20h6M12 14.5V20"/></svg></span>Standings</button>
</div>

<div id="modal"></div>

<script>
"use strict";

/* ---------- storage ---------- */
const KEY = "pusphaira_v1";
const PALETTE = ["#2563eb","#dc2626","#16a34a","#d97706","#7c3aed","#0891b2","#db2777","#65a30d","#4f46e5","#ea580c","#0d9488","#be123c"];
let storageOK = true;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function monthKey(s){ return (s||"").slice(0,7); }                    // "2026-09"
function monthName(k){ const p=(k||"").split("-"); const d=new Date(+p[0], (+p[1]||1)-1, 1);
  return isNaN(d) ? k : d.toLocaleString(undefined,{month:"short"})+" "+p[0]; }

// ISO-8601 week (Mon–Sun). weekKey("2026-09-09") -> "2026-W37"
function weekKey(iso){
  if(!iso) return "";
  const p = iso.split("-").map(Number);
  let d = new Date(Date.UTC(p[0], p[1]-1, p[2]));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);                 // shift to that week's Thursday
  const yStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const wk = Math.ceil(((d - yStart) / 86400000 + 1) / 7);
  return d.getUTCFullYear() + "-W" + String(wk).padStart(2, "0");
}
function weekMonday(k){
  const m = /^(\d{4})-W(\d{2})$/.exec(k||""); if(!m) return null;
  const jan4 = new Date(Date.UTC(+m[1], 0, 4));
  const mon = new Date(jan4);
  mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() || 7) - 1) + (+m[2] - 1) * 7);
  return mon;
}
function weekName(k){
  const mon = weekMonday(k); if(!mon) return k;
  const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
  const f = d => d.getUTCDate() + " " + d.toLocaleString(undefined, {month:"short", timeZone:"UTC"});
  return f(mon) + " – " + f(sun);
}

/* ---------- password / role ----------
   Opt-in: only matters when the deployed function has PUSPHAIRA_EDIT_KEY set.
   auth = { key, role }  stored per device.  role: "edit" (coach) | "view" (read-only).
   A 401 from /api/state means a password is required -> we show the gate.
   An open server (no header back) or device-only mode leaves role = "edit".
*/
const AUTH_KEY = "pusphaira_auth";
let auth = null;
try{ auth = JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); }catch(e){}
let authRole = (auth && auth.role) ? auth.role : "edit";
function canEdit(){ return authRole !== "view"; }
function authHeaders(){ return (auth && auth.key) ? { "x-pusphaira-key": auth.key } : {}; }
function setAuth(key, role){
  auth = { key: key, role: role }; authRole = role;
  try{ localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }catch(e){}
}
function clearAuth(){
  auth = null; authRole = "edit";
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
}
function noteRole(role){                       // called with the header value on a good GET
  if(!role) return;                            // open server -> stay "edit"
  if(role !== authRole){ authRole = role; if(auth) auth.role = role;
    try{ localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }catch(e){}
    render(); }
}

function showGate(msgText){

    + '<button type="submit" class="btn pri" id="ggo">Open</button>'
    + '</form>';

      if(!r.ok && r.status !== 404) throw new Error("HTTP "+r.status);
      const role = r.headers.get("x-pusphaira-role") || "edit";
      setAuth(v, role);
      let remote = null;
      if(r.status !== 404){ try{ remote = await r.json(); }catch(_){}}
      if(remote && (remote.updatedAt||0) >= (S.updatedAt||0)){
        const ui = S.ui, game = S.game;
        S = Object.assign(defaultState(), remote, { ui: Object.assign(defaultState().ui, ui), game: game });
        saveLocal();

/* ---------- cloud sync (Netlify function + Blobs) ----------
   Shared copy of the whole state lives at /api/state.
   - on launch we PULL and adopt it if it's newer than this device's copy
   - every save() queues a debounced PUSH
   - if there's no backend (opened as a file, or not deployed with the function)
     the fetch 404s and we fall back to device-only, no errors shown.
*/
const CLOUD = "/api/state";
let syncState = "…";            // "off" | "synced" | "syncing" | "offline" | "error"
let syncNote = "";
let pushPending = false, pushTimer = null, cloudReady = false;

function cloudLabel(){
  return syncState==="off"     ? "device only"
       : syncState==="locked"  ? "password needed"
       : syncState==="synced"  ? (authRole==="view" ? "on ✓ · view-only" : "on ✓")
       : syncState==="syncing" ? "saving…"
       : syncState==="offline" ? "offline — will retry"
       : syncState==="error"   ? "error — tap Sync now"
       : "…";
}
let lastSyncRender = "";
function afterSync(){
  if(syncState === lastSyncRender) return;               // only redraw when the state word changes
  lastSyncRender = syncState;
  if(S.ui.view==="exercises" || S.ui.view==="now") render();
}
function cloudBodyForPush(){ const c = JSON.parse(JSON.stringify(S)); delete c.ui; delete c.game; return c; }

let lastPullAt = 0;
async function cloudPull(opts){
  opts = opts || {};
  lastPullAt = Date.now();
  try{
    const r = await fetch(CLOUD, { cache:"no-store", headers: authHeaders() });
    if(r.status === 404){ syncState = "off"; if(authRole!=="edit"){ authRole="edit"; render(); } afterSync(); return; }
    if(r.status === 401){ clearAuth(); syncState = "locked"; afterSync(); showGate(); return; }
    if(!r.ok) throw new Error("HTTP "+r.status);
    noteRole(r.headers.get("x-pusphaira-role"));
    const remote = await r.json();
    cloudReady = true;
    if(remote && (remote.updatedAt||0) > (S.updatedAt||0) && !pushPending){
      const ui = S.ui, game = S.game;
      S = Object.assign(defaultState(), remote, { ui: Object.assign(defaultState().ui, ui), game: game });
      saveLocal();
      syncState = "synced"; syncNote = "updated from another device";
      render();
    }else{
      syncState = "synced"; syncNote = "";
      if(!remote || (S.updatedAt||0) > (remote.updatedAt||0)) cloudPush(true);
    }
  }catch(e){
    syncState = navigator.onLine ? "error" : "offline";
    syncNote = String((e && e.message) || e);
  }
  afterSync();
}
function cloudPush(now){
  if(syncState === "off" || syncState === "locked") return;
  if(!canEdit()) return;                       // view-only devices never push
  pushPending = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(cloudFlush, now ? 0 : 2500);   // coalesce bursts of taps into one write
}
async function cloudFlush(){
  if(!pushPending) return;
  if(!navigator.onLine){ syncState = "offline"; afterSync(); return; }
  syncState = "syncing"; afterSync();
  try{
    const r = await fetch(CLOUD, {
      method:"PUT",
      headers: Object.assign({ "content-type":"application/json" }, authHeaders()),
      body: JSON.stringify(cloudBodyForPush()),
      keepalive: true                       // let a flush finish even if the page is closing
    });
    if(r.status === 404){ syncState = "off"; pushPending = false; afterSync(); return; }
    if(r.status === 401){ clearAuth(); pushPending = false; syncState = "locked"; afterSync(); showGate(); return; }
    if(r.status === 403){ authRole = "view"; if(auth){ auth.role = "view"; try{ localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }catch(e){} }
      pushPending = false; syncState = "synced"; syncNote = ""; afterSync(); render(); return; }
    if(!r.ok) throw new Error("HTTP "+r.status);
    pushPending = false; cloudReady = true;
    syncState = "synced"; syncNote = "";
  }catch(e){
    syncState = navigator.onLine ? "error" : "offline";
    syncNote = String((e && e.message) || e);
  }
  afterSync();
}
// How often to poll the cloud for other devices' changes. Kept deliberately low to
// keep Netlify function usage down: editors 2 min, view-only devices 5 min. Pushes
// still go out on every change, and "Sync now" (Exercises tab) forces an immediate pull.
function pollMs(){ return canEdit() ? 120000 : 300000; }
function maybePull(force){
  if(syncState === "off" || syncState === "locked" || pushPending) return;
  if(document.visibilityState !== "visible") return;
  if(!force && Date.now() - lastPullAt < 25000) return;
  cloudPull();
}
function cloudInit(){
  cloudPull();
  addEventListener("online",  () => { if(pushPending) cloudFlush(); else maybePull(true); });
  addEventListener("offline", () => { syncState = "offline"; afterSync(); });
  addEventListener("pagehide", () => { if(pushPending) cloudFlush(); });
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "hidden"){ if(pushPending) cloudFlush(); return; }
    maybePull();
  });
  setInterval(() => {
    if(syncState === "off" || syncState === "locked" || pushPending) return;
    if(document.visibilityState !== "visible") return;
    if(Date.now() - lastPullAt >= pollMs()) cloudPull();
  }, 30000);
}

/* ---------- model helpers ---------- */
const T = () => S.training;
const activeEx = () => T().exercises.find(e => e.id === S.activeExerciseId) || null;
const playerName = id => (S.roster.find(p=>p.id===id)||{}).name || "?";
const pointsForWin = ex => ex.endGame ? 3 : 1;

function winnersOf(ex){
  if(ex.manualWinnerIds && ex.manualWinnerIds.length) return ex.manualWinnerIds.slice();
  if(ex.teams.length < 2) return [];
  const max = Math.max(...ex.teams.map(t=>t.score));
  return ex.teams.filter(t=>t.score===max).map(t=>t.id);
}
function trainingPoints(){
  const m = {}; S.roster.forEach(p=> m[p.id]=0);
  T().exercises.forEach(ex=>{
    if(!ex.finished) return;
    const w = new Set(winnersOf(ex));
    const pts = pointsForWin(ex);
    ex.teams.forEach(t=>{ if(w.has(t.id)) t.playerIds.forEach(pid=>{ if(pid in m) m[pid]+=pts; }); });
  });
  return m;
}
function seasonTotals(includeToday){
  const m = {}; S.roster.forEach(p=> m[p.id] = Number(S.startingPoints[p.id]||0));
  S.history.forEach(h=>{ for(const pid in h.points) if(pid in m) m[pid]+=h.points[pid]; });
  if(includeToday){ const c=trainingPoints(); for(const pid in c) m[pid]+=c[pid]; }
  return m;
}
function periodTotals(keyFn, key, includeToday){
  const m = {}; S.roster.forEach(p=> m[p.id]=0);
  S.history.forEach(h=>{ if(keyFn(h.date)!==key) return; for(const pid in h.points) if(pid in m) m[pid]+=h.points[pid]; });
  if(includeToday && keyFn(T().date)===key){ const c=trainingPoints(); for(const pid in c) m[pid]+=c[pid]; }
  return m;
}
function monthTotals(mkey, includeToday){ return periodTotals(monthKey, mkey, includeToday); }
function weekTotals(wkey, includeToday){ return periodTotals(weekKey, wkey, includeToday); }
function historyKeys(keyFn, current){
  const s = new Set(S.history.map(h=>keyFn(h.date)));
  s.add(keyFn(T().date)); s.add(current);
  return [...s].filter(Boolean).sort().reverse();
}
function historyMonths(){ return historyKeys(monthKey, S.ui.month); }
function historyWeeks(){ return historyKeys(weekKey, S.ui.week); }
function assignedInExercise(ex){ const s=new Set(); ex.teams.forEach(t=>t.playerIds.forEach(p=>s.add(p))); return s; }

/* ---------- attendance, record, movement ---------- */
// Who was at a banked training: explicit presentIds, else anyone put on a team that day.
function attendedSet(h){
  const s = new Set(h.presentIds || []);
  (h.exercises || []).forEach(ex => ex.teams.forEach(t => t.playerIds.forEach(p => s.add(p))));
  return s;
}
function seasonAttendance(){
  const m = {}; S.roster.forEach(p => m[p.id] = 0);
  S.history.forEach(h => attendedSet(h).forEach(pid => { if(pid in m) m[pid]++; }));
  return m;
}
function playerRecord(pid){
  let wins = 0, played = 0;
  S.history.forEach(h => (h.exercises || []).forEach(ex => {
    const on = ex.teams.find(t => t.playerIds.includes(pid));
    if(!on) return;
    played++;
    if(new Set(winnersOf(ex)).has(on.id)) wins++;
  }));
  return { wins, played };
}
function rankFromTotals(tot){
  const ord = S.roster.slice().sort((a,b)=> (tot[b.id]||0)-(tot[a.id]||0) || a.name.localeCompare(b.name));
  const r = {}; ord.forEach((p,i)=> r[p.id] = i+1); return r;
}
// Ranking as it stood one period earlier, for the movement arrows.
function prevTotalsFor(period){
  if(period === "season"){
    if(!S.history.length) return null;
    const m = {}; S.roster.forEach(p => m[p.id] = Number(S.startingPoints[p.id]||0));
    S.history.slice(0,-1).forEach(h => { for(const pid in h.points) if(pid in m) m[pid]+=h.points[pid]; });
    return m;
  }
  const keys = period === "week" ? historyWeeks() : historyMonths();   // newest-first
  const cur  = period === "week" ? S.ui.week : S.ui.month;
  const i = keys.indexOf(cur);
  const prevKey = i >= 0 ? keys[i+1] : keys[0];
  if(!prevKey) return null;
  return period === "week" ? weekTotals(prevKey, false) : monthTotals(prevKey, false);
}
function movementFor(period, curTotals){
  const prev = prevTotalsFor(period);
  if(!prev) return {};
  const pr = rankFromTotals(prev), cr = rankFromTotals(curTotals);
  const m = {};
  S.roster.forEach(p => { m[p.id] = (pr[p.id]||0) - (cr[p.id]||0); });   // + = moved up
  return m;
}
function mvHTML(d){
  if(d == null) return "";
  if(d === 0)  return '<span class="mv flat">&ndash;</span>';
  return d > 0 ? '<span class="mv up">&#9650;'+d+'</span>' : '<span class="mv dn">&#9660;'+(-d)+'</span>';
}
function niceDate(iso){
  const p = (iso||"").split("-"); if(p.length < 3) return iso;
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d) ? iso : d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
function sparkSVG(vals){
  const w = 300, hh = 54, pad = 5;
  const mn = Math.min(...vals), mx = Math.max(...vals), rng = (mx - mn) || 1;
  const pts = vals.map((v,i)=>{
    const x = pad + i*(w - 2*pad)/Math.max(vals.length-1,1);
    const y = hh - pad - (v - mn)/rng*(hh - 2*pad);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return '<svg viewBox="0 0 '+w+' '+hh+'" preserveAspectRatio="none" class="sparksvg">'
       + '<polyline points="'+pts+'" fill="none" stroke="var(--flag)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
       + '</svg>';
}
// long-press helper: fires fn() after a hold; sets data-lp so the trailing click is swallowed
function bindLongPress(el, fn){
  let t = null;
  const clear = () => { if(t){ clearTimeout(t); t = null; } };
  el.addEventListener("pointerdown", e => {
    if(e.target.closest("[data-minus]")) return;
    delete el.dataset.lp;
    clear();
    t = setTimeout(() => { t = null; el.dataset.lp = "1"; fn(); }, 500);
  });
  ["pointerup","pointercancel","pointerleave","pointermove"].forEach(ev => el.addEventListener(ev, clear));
}
let flashTeam = null;   // team id whose score should flip on the next Now render

/* ---------- mutations ---------- */
function addExercise(){
  if(!canEdit()) return;
  const n = T().exercises.length + 1;
  const ex = { id:uid(), name:"Exercise "+n, endGame:false, finished:false, manualWinnerIds:[], teams:[] };
  addTeam(ex); addTeam(ex);
  T().exercises.push(ex);
  S.activeExerciseId = ex.id;
  S.ui.view = "now";
  save(); render();
}
function addTeam(ex){
  const i = ex.teams.length;
  ex.teams.push({ id:uid(), name:"Team "+(i+1), color:PALETTE[i%PALETTE.length], score:0, playerIds:[] });
}
function removeExercise(id){
  if(!canEdit()) return;
  S.training.exercises = T().exercises.filter(e=>e.id!==id);
  if(S.activeExerciseId===id) S.activeExerciseId = (T().exercises[0]||{}).id || null;
  save(); render();
}
function bump(ex, teamId, d){
  if(ex.finished || !canEdit()) return;
  const t = ex.teams.find(x=>x.id===teamId); if(!t) return;
  const before = t.score;
  t.score = Math.max(0, t.score + d);
  flashTeam = (t.score !== before && d > 0) ? teamId : null;
  save(); renderNow();
}
function autoSplit(ex, n){
  if(!canEdit()) return;
  const pool = (T().presentIds.length ? T().presentIds : S.roster.map(p=>p.id)).slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  while(ex.teams.length < n) addTeam(ex);
  ex.teams = ex.teams.slice(0, Math.max(2,n));
  ex.teams.forEach(t=> t.playerIds = []);
  pool.forEach((pid,idx)=> ex.teams[idx % ex.teams.length].playerIds.push(pid));
  save(); render();
}

/* ---------- CSV / backup ---------- */
function csvCell(v){
  v = String(v==null?"":v);
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function toCSV(rows){ return rows.map(r=> r.map(csvCell).join(",")).join("\r\n"); }

function summaryCSV(){

    .forEach(p=> rows.push([p.name, present.has(p.id)?"yes":"no", tp[p.id]||0, wo[p.id]||0, mo[p.id]||0, st[p.id]||0]));

function detailCSV(){
  const rows = [["date","exercise","end_game","team","player","team_final_score","result","competition_points"]];
  T().exercises.filter(e=>e.finished).forEach(ex=>{
    const w = new Set(winnersOf(ex)), pts = pointsForWin(ex);
    ex.teams.forEach(t=>{

      (t.playerIds.length?t.playerIds:[null]).forEach(pid=>{
        rows.push([T().date, ex.name, ex.endGame?"yes":"no", t.name,
          pid?playerName(pid):"(no players)", t.score, won?"win":"loss", won?pts:0]);
      });

}
async function shareFile(name, text, mime){
  const blob = new Blob([text], {type:mime||"text/csv"});
  try{
    const f = new File([blob], name, {type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:name}); return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportSummary(){ shareFile("pusphaira_"+T().date+"_summary.csv", summaryCSV()); }

/* ---------- shareable standings image ---------- */
function standingsCanvas(mode){                                  // mode: "week" | "month" | "season"
  const isSeason = mode === "season";
  const primary = mode === "week"  ? weekTotals(S.ui.week, true)
                : mode === "month" ? monthTotals(S.ui.month, true)
                :                    seasonTotals(true);
  const season  = seasonTotals(true);
  const players = S.roster.slice().sort((a,b)=> (primary[b.id]-primary[a.id]) || a.name.localeCompare(b.name));
  const mv = movementFor(mode, primary);
  const title = mode === "week"  ? "Week of " + weekName(S.ui.week)
              : mode === "month" ? monthName(S.ui.month) + " standings"
              :                    "Season standings";
  const rightHdr = isSeason ? "Points" : (mode === "week" ? "Week    Season" : "Month    Season");

  const F = "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
  const W = 1080, padX = 60, headH = 240, rowH = 66, footH = 96;
  const H = headH + Math.max(players.length,1)*rowH + footH;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");

  const INK="#f4f7f2", DIM="#c6d6cc", RULE="#2f6650", FLAG="#f2c12e";
  x.fillStyle = "#1f4a37"; x.fillRect(0,0,W,H);                    // board
  x.fillStyle = "#183b2c"; x.fillRect(0,0,W,headH);               // header panel
  x.fillStyle = INK; x.font = "700 30px "+F; x.textBaseline = "alphabetic";
  x.fillText("Pusphaira", padX, 84);
  x.fillStyle = INK; x.font = "800 50px "+F;
  x.fillText(title, padX, 146);
  x.fillStyle = DIM; x.font = "400 25px "+F;
  const today = new Date().toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});
  x.fillText("as of "+today, padX, 188);
  x.fillStyle = DIM; x.font = "600 20px "+F;
  x.textAlign = "left";  x.fillText("Pos   Player", padX, headH-22);
  x.textAlign = "right"; x.fillText(rightHdr, W-padX, headH-22);
  x.fillStyle = FLAG; x.fillRect(0, headH-4, W, 4);               // marker rule

  players.forEach((p,i)=>{
    const y = headH + i*rowH, cy = y + rowH/2;
    const lead = i === 0;
    if(lead){ x.fillStyle = "rgba(242,193,46,.14)"; x.fillRect(0,y,W,rowH);
              x.fillStyle = FLAG; x.fillRect(0,y,6,rowH); }
    x.fillStyle = RULE; x.fillRect(padX, y+rowH-1, W-2*padX, 1);  // ruled row
    x.textBaseline = "middle";
    x.textAlign = "left";
    x.fillStyle = lead ? FLAG : INK;
    x.font = (lead ? "800 " : "600 ") + "30px " + F;
    x.fillText(String(i+1), padX, cy);

    x.fillStyle = INK; x.font = "600 33px "+F;
    let nm = p.name;
    const maxNameW = W - padX - 110 - (isSeason ? 200 : 300);
    if(x.measureText(nm).width > maxNameW){
      while(nm.length > 1 && x.measureText(nm+"…").width > maxNameW) nm = nm.slice(0,-1);
      nm += "…";
    }
    x.fillText(nm, padX + 78, cy);

    const d = mv[p.id];
    if(d){
      const nmW = x.measureText(nm).width;              // still measured in the name font
      x.fillStyle = d > 0 ? "#7fd694" : "#ff9a8a";
      x.font = "700 22px " + F;
      x.fillText((d > 0 ? "▲" : "▼") + Math.abs(d), padX + 78 + nmW + 16, cy);
    }

    x.textAlign = "right";
    if(isSeason){
      x.fillStyle = INK; x.font = "800 34px "+F;
      x.fillText(String(primary[p.id]||0), W - padX, cy);
    }else{
      x.fillStyle = DIM; x.font = "600 26px "+F;
      x.fillText(String(season[p.id]||0), W - padX, cy);
      x.fillStyle = INK; x.font = "800 34px "+F;
      x.fillText(String(primary[p.id]||0), W - padX - 150, cy);
    }
  });

  x.textAlign = "left"; x.textBaseline = "alphabetic";
  x.fillStyle = RULE; x.fillRect(padX, H-62, W-2*padX, 2);
  x.fillStyle = DIM; x.font = "400 22px "+F;
  x.fillText(players.length+" players    win 1 pt    end game 3 pts", padX, H-28);
  return c;
}
function exportStandingsImage(mode){
  if(!S.roster.length){ alert("Add players first."); return; }
  const tag = mode === "week" ? S.ui.week : mode === "month" ? S.ui.month : "season";
  const name = "pusphaira_"+tag+".png";
  standingsCanvas(mode).toBlob(async (blob)=>{
    try{
      const f = new File([blob], name, {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; }
    }catch(e){ if(e && e.name==="AbortError") return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }, "image/png");
}
function importBackup(){
  if(!canEdit()) return;
  const inp = document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange = () => {
    const file = inp.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(r.result);
        if(!data || !Array.isArray(data.roster)) throw new Error("bad file");
        if(confirm("Replace ALL current data with this backup?")){
          S = Object.assign(defaultState(), data, { ui: Object.assign(defaultState().ui, data.ui||{}) });
          save(); render();
        }
      }catch(e){ alert("Could not read that file."); }
    };
    r.readAsText(file);
  };
  inp.click();
}

function finishTraining(){
  if(!canEdit()) return;
  const anyFinished = T().exercises.some(e=>e.finished);
  if(!anyFinished){ alert("Finish at least one exercise first."); return; }
  if(!confirm("End training for "+T().date+"?\n\nThis banks today's points into the season totals and starts a fresh training. Export your CSV first if you need it.")) return;
  const pts = trainingPoints();
  S.history.push({ date:T().date, points:pts, presentIds:T().presentIds.slice(), exercises: JSON.parse(JSON.stringify(T().exercises)) });
  S.training = newTraining();
  S.activeExerciseId = null;
  S.ui.view = "now";
  save(); render();
}

function editLineups(exId, keepScroll){
  if(!canEdit()) return;
  const ex = T().exercises.find(e=>e.id===exId); if(!ex) return;
  let h = '<h2>'+esc(ex.name)+' line-ups</h2>';
  h += '<div class="row wrap" style="margin-bottom:10px">'
     + '<button class="btn sm" data-act="add-team">+ Add team</button>'
     + '<button class="btn sm" data-act="auto2">Auto-split 2</button>'
     + '<button class="btn sm" data-act="auto3">Auto-split 3</button>'
     + '<button class="btn sm" data-act="auto4">Auto-split 4</button>'
     + '</div>';
  const assigned = assignedInExercise(ex);
  const present = new Set(T().presentIds);
  // Show players marked here today, plus anyone already on a team (so they can be pulled off).
  const pickable = S.roster.filter(p => present.size === 0 || present.has(p.id) || assigned.has(p.id));
  if(present.size === 0){
    h += '<p class="muted small" style="margin:0 0 10px">Nobody is marked here today &mdash; showing the whole squad. Tick who&rsquo;s here on the Players tab to narrow this.</p>';
  }
  ex.teams.forEach(t=>{
    h += '<div class="card" style="border-left:6px solid '+t.color+'">'
       + '<div class="row" style="margin-bottom:8px">'
       + '<b class="grow">'+esc(t.name)+'</b>'
       + '<button class="btn sm" data-ren="'+t.id+'">Rename</button>'
       + (ex.teams.length>2?'<button class="btn sm danger" data-delt="'+t.id+'">Remove</button>':'')
       + '</div><div class="chips">';
    if(!pickable.length) h += '<span class="muted small">No players to pick. Add them, or mark who&rsquo;s here, on the Players tab.</span>';
    pickable.forEach(p=>{
      const onThis = t.playerIds.includes(p.id);
      const onOther = !onThis && assigned.has(p.id);
      const away = present.size > 0 && !present.has(p.id);
      h += '<button class="chip '+(onThis?'on':'')+(onOther?' dim':'')+(away?' away':'')+'" data-tg="'+t.id+'|'+p.id+'">'+esc(p.name)+(away?' (away)':'')+'</button>';
    });
    h += '</div></div>';
  });
  h += '<button class="btn pri" data-act="close" style="width:100%">Done</button>';
  openModal(h);
  const sheet = document.querySelector("#modal .sheet");
  if(keepScroll){ sheet.scrollTop = keepScroll; requestAnimationFrame(()=>{ sheet.scrollTop = keepScroll; }); }
  sheet.addEventListener("click", ev=>{
    const b = ev.target.closest("button"); if(!b) return;
    const sc = sheet.scrollTop;
    if(b.dataset.act==="close"){ closeModal(); render(); return; }
    if(b.dataset.act==="add-team"){ addTeam(ex); save(); editLineups(exId, sc); return; }
    if(b.dataset.act==="auto2"){ autoSplit(ex,2); editLineups(exId, sc); return; }
    if(b.dataset.act==="auto3"){ autoSplit(ex,3); editLineups(exId, sc); return; }
    if(b.dataset.act==="auto4"){ autoSplit(ex,4); editLineups(exId, sc); return; }
    if(b.dataset.ren){ const t=ex.teams.find(x=>x.id===b.dataset.ren); const n=prompt("Team name", t.name); if(n){ t.name=n.trim(); save(); editLineups(exId, sc);} return; }
    if(b.dataset.delt){ ex.teams=ex.teams.filter(x=>x.id!==b.dataset.delt); save(); editLineups(exId, sc); return; }
    if(b.dataset.tg){
      // Toggle in place — no rebuild, so the sheet does NOT scroll back to the top.
      const [tid,pid]=b.dataset.tg.split("|");
      const t=ex.teams.find(x=>x.id===tid);
      const wasOn = t.playerIds.includes(pid);
      if(wasOn){ t.playerIds=t.playerIds.filter(x=>x!==pid); }
      else{ ex.teams.forEach(x=> x.playerIds=x.playerIds.filter(y=>y!==pid)); t.playerIds.push(pid); }
      save();
      const assignedTeam = wasOn ? null : tid;
      sheet.querySelectorAll('[data-tg]').forEach(el=>{
        const parts = el.dataset.tg.split("|");
        if(parts[1] !== pid) return;
        el.classList.toggle("on", parts[0] === assignedTeam);
        el.classList.toggle("dim", assignedTeam !== null && parts[0] !== assignedTeam);
      });
    }
  });
}
function editWinner(exId){
  if(!canEdit()) return;
  const ex = T().exercises.find(e=>e.id===exId); if(!ex) return;
  const auto = new Set(winnersOf(ex));
  const cur = ex.manualWinnerIds && ex.manualWinnerIds.length ? new Set(ex.manualWinnerIds) : auto;
  let h = '<h2>'+esc(ex.name)+' winner</h2><p class="muted small">Tap the team(s) that win. Highest score is picked automatically; override here for draws or a coach&rsquo;s call.</p><div class="chips">';
  ex.teams.forEach(t=>{
    h += '<button class="chip '+(cur.has(t.id)?'on':'')+'" data-w="'+t.id+'">'+esc(t.name)+' &middot; '+t.score+'</button>';
  });
  h += '</div><div class="hr"></div>'
     + '<div class="row wrap"><button class="btn sm" data-act="clear">Reset to automatic</button>'
     + '<span class="spacer"></span><button class="btn pri" data-act="close">Done</button></div>';
  openModal(h);
  document.querySelector("#modal .sheet").addEventListener("click", ev=>{
    const b = ev.target.closest("button"); if(!b) return;
    if(b.dataset.act==="close"){ closeModal(); render(); return; }
    if(b.dataset.act==="clear"){ ex.manualWinnerIds=[]; save(); editWinner(exId); return; }
    if(b.dataset.w){
      const set = new Set(ex.manualWinnerIds && ex.manualWinnerIds.length ? ex.manualWinnerIds : winnersOf(ex));
      set.has(b.dataset.w) ? set.delete(b.dataset.w) : set.add(b.dataset.w);
      ex.manualWinnerIds = [...set];
      save(); editWinner(exId);
    }
  });
}

function showPlayerCard(pid){
  const p = S.roster.find(x=>x.id===pid); if(!p) return;
  const season = seasonTotals(true), sRank = rankFromTotals(season);
  const wk = weekTotals(S.ui.week, true), mo = monthTotals(S.ui.month, true);
  const att = seasonAttendance()[pid] || 0, nT = S.history.length;
  const rec = playerRecord(pid);

  let cum = Number(S.startingPoints[pid]||0);
  const series = [cum];
  S.history.forEach(h => { cum += (h.points[pid]||0); series.push(cum); });
  const todayPts = trainingPoints()[pid] || 0;
  if(todayPts){ series.push(cum + todayPts); }

  const recent = S.history.slice(-6).reverse().map(h => {
    const won = (h.exercises||[]).filter(ex => {
      const on = ex.teams.find(t => t.playerIds.includes(pid));
      return on && new Set(winnersOf(ex)).has(on.id);
    }).length;
    return { date: h.date, got: h.points[pid]||0, won };
  });

  let h = '<h2>'+esc(p.name)+'</h2>';
  h += '<div class="pcgrid">'
     + pcstat("Season points", season[pid]||0, "rank #"+(sRank[pid]||"-"))
     + pcstat("This week", wk[pid]||0, "")
     + pcstat("This month", mo[pid]||0, "")
     + pcstat("Attendance", att + (nT ? " / "+nT : ""), nT ? "trainings" : "none yet")
     + pcstat("Exercises won", rec.wins, "of "+rec.played+" played")
     + '</div>';
  if(series.length > 1) h += '<div class="spark">'+sparkSVG(series)+'</div>'
     + '<p class="muted small" style="margin:0">Season points over time</p>';
  h += '<div class="hr"></div><h3 style="font-size:14px">Recent trainings</h3>';
  if(!recent.length){
    h += '<p class="muted small">No banked trainings yet.</p>';
  }else{
    h += '<div class="list">';
    recent.forEach(r => {
      h += '<div class="item"><div class="grow nm">'+esc(niceDate(r.date))+'</div>'
         + '<div class="col num'+(r.got?' hi':'')+'">'+(r.got ? "+"+r.got : "0")+'</div>'
         + '<div class="col num">'+r.won+' won</div></div>';
    });
    h += '</div>';
  }
  h += '<div class="hr"></div><button class="btn pri" data-close="1" style="width:100%">Close</button>';
  openModal(h);
  document.querySelector("#modal .sheet").addEventListener("click", e => { if(e.target.dataset.close) closeModal(); });
}

/* ================= GAME MODE — live match event log ================= */
const G_ACTIONS = ["Shot","Corner","Foul","Penalty","Goal","Save"];
const G_SHOT = ["On target","Off target","Woodwork","Blocked","Header","In-box","Out-of-box","Uncontested","Contested"];
const G_DESC = {
  Shot: G_SHOT,
  Corner: ["Near post","Central box","Far post","Six-Yard box","Edge of the box"],
  Foul: G_SHOT,
  Penalty: ["Natural","Unnatural","Left","Right","Top","Bottom","Center","Goal","No goal","Out"],
  Goal: ["Open Play","Direct transition","Set-piece","Rebound","Tap-In","Cutback finish","Solo","OG"],
  Save: ["Deflection","Leg Save","Collapse","Clearance","Catch","Parried","Spilled","Rebound Conceded"]
};
const HALF_CAP = 45*60000;

let gameScreen = "main";            // "main" | "descriptors"  (not persisted)
let descCtx = null;                 // { action, team, sel:Set }
let gameTimer = null;

function saveGame(){ saveLocal(); }  // device-local only, never pushed
function G(){ return S.game; }

function halfElapsedMs(){
  const g = G();
  return g.accMs + (g.running && g.segStart ? Date.now() - g.segStart : 0);
}
function clockState(){
  const e = halfElapsedMs();
  const base = G().half === 2 ? HALF_CAP : 0;
  return { mainMs: base + Math.min(e, HALF_CAP), stoppageMs: Math.max(0, e - HALF_CAP) };
}
function fmtClock(ms){
  ms = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(ms/60), s = ms%60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
function fmtPlus(ms){
  ms = Math.max(0, Math.floor(ms/1000));
  return Math.floor(ms/60) + ":" + String(ms%60).padStart(2,"0");
}
function eventTimeText(ev){
  return fmtClock(ev.mainMs) + (ev.stoppageMs ? " +" + fmtPlus(ev.stoppageMs) : "");
}
function goalCount(team){ return G().events.filter(e=>e.team===team && e.action==="Goal").length; }
function gTally(team){
  const ev = G().events.filter(e=>e.team===team);
  const n = a => ev.filter(e=>e.action===a).length;
  return {
    shots:n("Shot"),
    onTarget: ev.filter(e=>e.action==="Shot" && e.descriptors.includes("On target")).length,
    corners:n("Corner"), fouls:n("Foul"), pens:n("Penalty"), goals:n("Goal"), saves:n("Save")
  };
}

function gameTick(){
  if(S.ui.mode!=="game" || !G().running){ clearInterval(gameTimer); gameTimer=null; return; }
  const cs = clockState();
  const mc = document.getElementById("matchClock");
  const sp = document.getElementById("stoppage");
  if(mc) mc.textContent = fmtClock(cs.mainMs);
  if(sp){
    if(cs.stoppageMs > 0){ sp.textContent = "+"+fmtPlus(cs.stoppageMs); sp.hidden=false; sp.classList.remove("leaving"); }
    else sp.hidden = true;
  }
}
function syncGameTimer(){
  clearInterval(gameTimer); gameTimer=null;
  if(S.ui.mode==="game" && G().running) gameTimer = setInterval(gameTick, 200);
}
function animateStoppageOutThen(cb){
  const sp = document.getElementById("stoppage");
  if(sp && !sp.hidden){ sp.classList.add("leaving"); setTimeout(cb, 380); }
  else cb();
}

function controlPress(){
  const g = G();
  if(g.phase === "idle"){
    const an = (document.getElementById("awayName")||{}).value;
    g.teams.home = "Pusphaira";
    g.teams.away = (an||"").trim() || "Red";
    g.phase="firstHalf"; g.half=1; g.running=true; g.segStart=Date.now(); g.accMs=0; g.startedTs=Date.now();
    saveGame(); renderGame();
  }else if(g.phase === "firstHalf"){
    g.running=false; g.accMs += g.segStart ? Date.now()-g.segStart : 0; g.segStart=null; g.h1Ms = g.accMs;
    syncGameTimer();
    animateStoppageOutThen(()=>{ g.phase="halfTime"; saveGame(); renderGame(); });
  }else if(g.phase === "halfTime"){
    g.phase="secondHalf"; g.half=2; g.running=true; g.segStart=Date.now(); g.accMs=0;
    saveGame(); renderGame();
  }else if(g.phase === "secondHalf"){
    g.running=false; g.accMs += g.segStart ? Date.now()-g.segStart : 0; g.segStart=null; g.h2Ms = g.accMs; g.endedTs=Date.now();
    syncGameTimer();
    animateStoppageOutThen(()=>{ g.phase="ended"; gameScreen="main"; saveGame(); renderGame(); });
  }
}
function controlLabel(){
  return G().phase==="idle" ? "Start match"
       : G().phase==="firstHalf" ? "Half time"
       : G().phase==="halfTime" ? "Restart (2nd half)"
       : G().phase==="secondHalf" ? "End match" : "";
}
function controlClass(){
  return G().phase==="firstHalf" ? "amber" : G().phase==="secondHalf" ? "red" : "green";
}

function openDescriptors(action, team){ descCtx = { action, team, sel:new Set(), playerId:null, note:"" }; gameScreen="descriptors"; renderGame(); }
function cancelDescriptors(){ descCtx=null; gameScreen="main"; renderGame(); }
function saveDescriptors(){
  if(!descCtx) return;
  captureDescExtras();
  const cs = clockState();
  G().events.push({
    id: uid(), team: descCtx.team, action: descCtx.action, descriptors:[...descCtx.sel],
    playerId: descCtx.team==="home" ? (descCtx.playerId||null) : null,
    note: (descCtx.note||"").trim(),
    half: G().half, mainMs: cs.mainMs, stoppageMs: cs.stoppageMs, ts: Date.now()
  });
  descCtx=null; gameScreen="main"; saveGame(); renderGame();
}
function undoLastEvent(){ if(G().events.length){ G().events.pop(); saveGame(); renderGame(); } }
function reportNewMatch(){                     // from the ended report — no confirm needed
  const prevAway = G().teams.away;
  S.game = newGame();
  if(prevAway && prevAway !== "Red") S.game.teams.away = prevAway;
  gameScreen="main"; descCtx=null; focusAway=true; saveGame(); renderGame();
}
function discardMatch(){                       // abandon a match in progress
  const g = G();
  if((g.events.length || g.phase !== "idle") &&
     !confirm("Discard this match? The event log will be deleted.")) return;
  S.game = newGame(); gameScreen="main"; descCtx=null; saveGame(); renderGame();
}
let focusAway = false;

function renderGame(){
  const g = G(), cs = clockState();
  g.teams.home = "Pusphaira";                 // blue / left is always Pusphaira
  let h = '<div class="gamewrap">' + modeBar();

  // clock bar — always on
  h += '<div class="clockbar">'
     + (g.phase!=="idle" && g.phase!=="ended" ? '<button class="gdiscard" id="discardMatch">Discard</button>' : '')
     + '<div class="clockmain"><span id="matchClock">'+fmtClock(cs.mainMs)+'</span>'
     +   '<span id="stoppage" class="stoppage"'+((cs.stoppageMs>0 && g.running)?'':' hidden')+'>+'+fmtPlus(cs.stoppageMs)+'</span></div>'
     + '<div class="teamrow">'
     +   '<span class="tn home">'+esc(g.teams.home)+' <b>'+goalCount("home")+'</b></span>'
     +   '<span class="tn away"><b>'+goalCount("away")+'</b> '+esc(g.teams.away)+'</span>'
     + '</div></div>';

  if(g.phase === "ended"){
    h += renderReport();
    h += '<button class="control green" id="newMatch">Start a new match</button>';
  }else if(gameScreen === "descriptors" && descCtx){
    h += renderDescriptors();
  }else if(g.phase === "idle"){
    h += '<div class="gcenter">'
       + '<p class="muted small" style="margin:0 0 4px">Left is <b class="home-l">Pusphaira</b>. Name the opponent, then kick off &mdash; the clock runs from the whistle.</p>'
       + '<label class="small away-l">Right / red &mdash; opponent</label>'
       + '<input type="text" id="awayName" value="'+esc(g.teams.away==="Red"?"":g.teams.away)+'" placeholder="Opponent" maxlength="18">'
       + '</div>';
    h += gControl();
  }else{
    h += renderGameMain();
    h += gControl();
  }
  h += '</div>';
  document.getElementById("app").innerHTML = h;
  wireGame();
  syncGameTimer();
  if(focusAway){ focusAway=false; setTimeout(()=>{ const el=document.getElementById("awayName"); if(el){ el.focus(); el.select(); } }, 60); }
}
function gControl(){
  return '<button class="control '+controlClass()+'" id="gControl">'+esc(controlLabel())+'</button>';
}
function renderGameMain(){
  const g = G();
  let h = '<div class="gamemain">';
  ["home","away"].forEach(team=>{
    h += '<div class="gside '+team+'">';
    G_ACTIONS.forEach(a=>{
      h += '<button class="gbtn" data-act="'+a+'" data-team="'+team+'">'+a+'</button>';
    });
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="undo">'+(g.events.length
        ? '<button id="undoEv">&#8630; Undo last</button><span>'+g.events.length+' event'+(g.events.length===1?'':'s')+' logged</span>'
        : '<span class="muted">No events yet</span>')+'</div>';
  return h;
}
function renderDescriptors(){
  const list = G_DESC[descCtx.action] || [];
  const tname = descCtx.team==="home" ? G().teams.home : G().teams.away;
  let h = '<div class="descwrap">'
    + '<div class="deschead '+descCtx.team+'">'+esc(tname)+' &mdash; '+descCtx.action+'</div>';
  // Player picker — Pusphaira (home) only
  if(descCtx.team==="home"){
    if(S.roster.length){
      h += '<div class="descrow"><select id="descPlayer" class="btn">'
         + '<option value="">Player &mdash; optional</option>'
         + S.roster.slice().sort((a,b)=>a.name.localeCompare(b.name))
             .map(p=>'<option value="'+p.id+'"'+(descCtx.playerId===p.id?' selected':'')+'>'+esc(p.name)+'</option>').join('')
         + '</select></div>';
    }else{
      h += '<div class="descrow"><p class="muted small" style="margin:0">Add players on the Players tab to tag who did it.</p></div>';
    }
  }
  h += '<div class="descgrid">';
  list.forEach(d=>{
    h += '<button class="descchip'+(descCtx.sel.has(d)?' on':'')+'" data-desc="'+esc(d)+'">'+esc(d)+'</button>';
  });
  h += '</div>'
    + '<div class="descrow"><input type="text" id="descNote" placeholder="Note (optional)" maxlength="140" value="'+esc(descCtx.note||"")+'"></div>'
    + '<div class="descfoot">'
    + '<button class="control grey" id="descCancel">Cancel</button>'
    + '<button class="control green" id="descSave">Save</button>'
    + '</div></div>';
  return h;
}
// keep the select / note in descCtx so they survive if the screen re-renders
function captureDescExtras(){
  if(!descCtx) return;
  const sel = document.getElementById("descPlayer");
  const note = document.getElementById("descNote");
  if(sel) descCtx.playerId = sel.value || null;
  if(note) descCtx.note = note.value;
}
function renderReport(){
  const g = G(), t = gTally("home"), a = gTally("away");
  const rows = [
    ["Goals", t.goals, a.goals], ["Shots", t.shots, a.shots], ["On target", t.onTarget, a.onTarget],
    ["Corners", t.corners, a.corners], ["Fouls", t.fouls, a.fouls],
    ["Penalties", t.pens, a.pens], ["Saves", t.saves, a.saves]
  ];
  let h = '<div class="report">'
    + '<div class="rscore"><span class="home">'+esc(g.teams.home)+'</span>'
    +   '<b>'+t.goals+' &ndash; '+a.goals+'</b>'
    +   '<span class="away">'+esc(g.teams.away)+'</span></div>'
    + '<div class="rtally">';
  rows.forEach(r=>{
    h += '<div class="trow"><span class="tv home">'+r[1]+'</span><span class="tl">'+r[0]+'</span><span class="tv away">'+r[2]+'</span></div>';
  });
  h += '</div><div class="hr"></div><h3 style="font-size:14px;margin:0 0 6px">Timeline</h3>';
  if(!g.events.length){ h += '<p class="muted small">No events were logged.</p>'; }
  else{
    h += '<div class="tline">';
    g.events.slice().forEach(e=>{
      const pn = e.playerId ? playerName(e.playerId) : "";
      h += '<div class="tev '+e.team+'">'
         + '<span class="tt">'+eventTimeText(e)+'</span>'
         + '<span class="ta">'+esc(e.action)+'</span>'
         + '<span class="td">'+(pn?'<b>'+esc(pn)+'</b> &middot; ':'')+esc(e.descriptors.join(", "))
         +   (e.note?' <i>&ldquo;'+esc(e.note)+'&rdquo;</i>':'')+'</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="hr"></div><p class="muted small" style="margin:0 0 8px">Save the report before starting a new match &mdash; game data lives on this device only.</p>'
    + '<div class="row wrap">'
    + '<button class="btn pri" id="rImg">Match image</button>'
    + '<button class="btn" id="rCsv">Match CSV</button>'
    + '</div></div>';
  return h;
}

function wireGame(){
  const on = (id,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener("click",fn); };
  const mb = document.querySelector(".gamewrap > .modebar");
  if(mb) mb.addEventListener("click", ()=>{ S.ui.mode="training"; saveUi(); render(); });
  on("gControl", controlPress);
  on("undoEv", undoLastEvent);
  on("discardMatch", discardMatch);
  on("newMatch", reportNewMatch);
  on("rCsv", exportMatchCSV);
  on("rImg", exportMatchImage);
  on("descCancel", cancelDescriptors);
  on("descSave", saveDescriptors);
  document.querySelectorAll(".gbtn").forEach(b=> b.addEventListener("click", ()=> openDescriptors(b.dataset.act, b.dataset.team)));
  document.querySelectorAll("[data-desc]").forEach(b=> b.addEventListener("click", ()=>{
    const d = b.dataset.desc;
    if(descCtx.sel.has(d)){ descCtx.sel.delete(d); b.classList.remove("on"); }
    else { descCtx.sel.add(d); b.classList.add("on"); }
    captureDescExtras();
  }));
}

/* ----- game exports ----- */
function matchCSV(){
  const g = G();
  const rows = [["time","half","team","player","action","descriptors","note"]];
  g.events.forEach(e=>{
    rows.push([ eventTimeText(e), e.half, e.team==="home"?g.teams.home:g.teams.away,
      e.playerId?playerName(e.playerId):"", e.action, e.descriptors.join("|"), e.note||"" ]);
  });
  return toCSV(rows);
}
function exportMatchCSV(){ shareFile("pusphaira_match_"+todayISO()+".csv", matchCSV()); }
function matchReportCanvas(){
  const g = G(), t = gTally("home"), a = gTally("away");
  const F = "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
  const W = 1080, padX = 60, headH = 300, rowH = 52, gap = 30, evH = 46;
  const rows = [["Goals",t.goals,a.goals],["Shots",t.shots,a.shots],["On target",t.onTarget,a.onTarget],
    ["Corners",t.corners,a.corners],["Fouls",t.fouls,a.fouls],["Penalties",t.pens,a.pens],["Saves",t.saves,a.saves]];
  const H = headH + rows.length*rowH + gap + 56 + Math.max(g.events.length,1)*evH + 80;
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const x = c.getContext("2d");
  const INK="#f4f7f2", DIM="#c6d6cc", RULE="#2f6650", BLUE="#5aa0ff", RED="#ff6b6b";
  x.fillStyle="#1f4a37"; x.fillRect(0,0,W,H);
  x.fillStyle="#183b2c"; x.fillRect(0,0,W,headH);
  x.textBaseline="alphabetic"; x.textAlign="left";
  x.fillStyle=DIM; x.font="600 24px "+F; x.fillText("PUSPHAIRA  ·  MATCH REPORT", padX, 66);
  x.textAlign="center";
  x.fillStyle=BLUE; x.font="800 44px "+F; x.fillText(g.teams.home, W*0.28, 150);
  x.fillStyle=RED;  x.fillText(g.teams.away, W*0.72, 150);
  x.fillStyle=INK;  x.font="800 90px "+F; x.fillText(t.goals+"  –  "+a.goals, W/2, 172);
  x.fillStyle=DIM;  x.font="400 22px "+F;
  const d = g.startedTs ? new Date(g.startedTs) : new Date();
  x.fillText(d.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})
     + "   ·   " + fmtClock(HALF_CAP) + (g.h1Ms>HALF_CAP?" +"+fmtPlus(g.h1Ms-HALF_CAP):"")
     + " / " + fmtClock(HALF_CAP) + (g.h2Ms>HALF_CAP?" +"+fmtPlus(g.h2Ms-HALF_CAP):""), W/2, 236);
  x.fillStyle=RULE; x.fillRect(0, headH-3, W, 3);

  let y = headH + 20;
  x.font="700 30px "+F;
  rows.forEach((r,i)=>{
    if(i%2===0){ x.fillStyle="rgba(255,255,255,.04)"; x.fillRect(0,y-34,W,rowH); }
    x.textAlign="left";   x.fillStyle=BLUE; x.fillText(String(r[1]), padX+40, y);
    x.textAlign="center"; x.fillStyle=DIM;  x.font="500 24px "+F; x.fillText(r[0], W/2, y);
    x.font="700 30px "+F;
    x.textAlign="right";  x.fillStyle=RED;  x.fillText(String(r[2]), W-padX-40, y);
    y += rowH;
  });
  y += gap;
  x.textAlign="left"; x.fillStyle=RULE; x.fillRect(padX, y-30, W-2*padX, 2);
  x.fillStyle=DIM; x.font="700 22px "+F; x.fillText("TIMELINE", padX, y); y += 20;
  x.font="500 24px "+F;
  if(!g.events.length){ x.fillStyle=DIM; x.fillText("No events logged.", padX, y+20); }
  g.events.forEach(e=>{
    const col = e.team==="home" ? BLUE : RED;
    x.fillStyle=col; x.fillRect(padX, y+2, 6, evH-14);
    x.textAlign="left"; x.fillStyle=DIM; x.font="600 22px "+F;
    x.fillText(eventTimeText(e), padX+20, y+22);
    x.fillStyle=INK; x.font="700 24px "+F;
    x.fillText(e.action, padX+150, y+22);
    x.fillStyle=DIM; x.font="400 21px "+F;
    let dd = (e.playerId?playerName(e.playerId)+" · ":"") + e.descriptors.join(", ")
           + (e.note?"  “"+e.note+"”":"");
    const maxW = W - padX - 340;
    if(x.measureText(dd).width > maxW){ while(dd.length>1 && x.measureText(dd+"…").width>maxW) dd=dd.slice(0,-1); dd+="…"; }
    x.fillText(dd, padX+330, y+22);
    y += evH;
  });
  return c;
}
function exportMatchImage(){
  const name = "pusphaira_match_"+todayISO()+".png";
  matchReportCanvas().toBlob(async (blob)=>{
    try{
      const f = new File([blob], name, {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; }
    }catch(e){ if(e && e.name==="AbortError") return; }
    const url = URL.createObjectURL(blob);
    const el = document.createElement("a"); el.href=url; el.download=name; document.body.appendChild(el); el.click();
    el.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }, "image/png");
}

/* ---------- render + events ---------- */
function modeBar(){
  const g = S.ui.mode === "game";
  return '<div class="modebar">'
    + '<span class="'+(g?'':'lit')+'">Training</span>'
    + '<button class="switch'+(g?' on':'')+'" id="modeToggle" role="switch" aria-checked="'+(g?'true':'false')+'" aria-label="Switch between training and game mode"><span class="knob"></span></button>'
    + '<span class="'+(g?'lit':'')+'">Game</span>'
    + '</div>';
}
function render(){
  document.body.classList.toggle("viewonly", !canEdit());
  document.body.classList.toggle("gamemode", S.ui.mode === "game");
  if(S.ui.mode === "game"){ renderGame(); return; }
  const app = document.getElementById("app");
  const v = S.ui.view;
  app.innerHTML = modeBar() + (
      v==="exercises" ? viewExercises()
    : v==="players"   ? viewPlayers()
    : v==="standings" ? viewStandings()
    :                   viewNow());
  [...document.querySelectorAll(".nav button")].forEach(b=> b.classList.toggle("on", b.dataset.go===v));
  wire();
  const mb = document.querySelector("#app > .modebar");
  if(mb) mb.addEventListener("click", ()=>{ S.ui.mode = "game"; saveUi(); render(); });
}
function renderNow(){ if(S.ui.mode==="training" && S.ui.view==="now") render(); }

// View / display prefs are device-local: write them here so they don't count as a
// data change (no cloud push, no updatedAt bump).
function saveUi(){ saveLocal(); }
function go(v){ S.ui.view=v; saveUi(); render(); }

function wire(){
  const $ = s => document.getElementById(s);
  const on = (id,ev,fn)=>{ const el=$(id); if(el) el.addEventListener(ev,fn); };

  on("helpBtn","click",showHelp);
  on("newEx","click",addExercise);

  // NOW view
  const ex = activeEx();
  if(S.ui.view==="now" && ex){
    on("exPick","change",e=>{ S.activeExerciseId=e.target.value; (canEdit()?save():saveUi()); render(); });
    if(canEdit()){
      on("renEx","click",()=>{ const n=prompt("Exercise name", ex.name); if(n){ ex.name=n.trim(); save(); render(); } });
      on("egToggle","click",()=>{ ex.endGame=!ex.endGame; save(); render(); });
      on("lineups","click",()=>editLineups(ex.id));
      on("addTeam","click",()=>{ addTeam(ex); save(); render(); });
      on("finishEx","click",()=>{
        if(assignedInExercise(ex).size===0 && !confirm("No players are assigned to teams. Finish anyway?")) return;
        ex.finished=true; save(); render();
      });
      on("reopen","click",()=>{ ex.finished=false; save(); render(); });
      on("editWin","click",()=>editWinner(ex.id));
      on("delEx","click",()=>{ if(confirm("Delete "+ex.name+"?")) removeExercise(ex.id); });
      document.querySelectorAll("[data-team]").forEach(el=>{
        const tid = el.dataset.team;
        bindLongPress(el, ()=>{
          if(ex.finished) return;
          const t = ex.teams.find(x=>x.id===tid); if(!t) return;
          const n = prompt("Set an exact score for "+t.name, t.score);
          if(n!==null && n!==""){ t.score = Math.max(0, parseInt(n,10)||0); save(); renderNow(); }
        });
        el.addEventListener("click",e=>{
          if(el.dataset.lp){ delete el.dataset.lp; return; }   // this click closed a long-press
          if(e.target.closest("[data-minus]")) return;
          bump(ex, tid, +1);
        });
      });
      document.querySelectorAll("[data-minus]").forEach(el=>{
        el.addEventListener("click",e=>{ e.stopPropagation(); bump(ex, el.dataset.minus, -1); });
      });
    }
  }

  // EXERCISES view
  if(S.ui.view==="exercises"){
    document.querySelectorAll("[data-open]").forEach(el=> el.addEventListener("click",()=>{ S.activeExerciseId=el.dataset.open; S.ui.view="now"; (canEdit()?save():saveUi()); render(); }));
    on("imgWeek","click",()=>exportStandingsImage("week"));
    on("imgMonth","click",()=>exportStandingsImage("month"));
    on("imgSeason","click",()=>exportStandingsImage("season"));
    on("expSum","click",exportSummary);
    on("syncNow","click",()=>{ if(pushPending) cloudFlush(); else cloudPull(); });
    on("lockBtn","click",lockApp);
    if(canEdit()){
      on("tDate","change",e=>{ T().date=e.target.value||todayISO(); save(); });
      document.querySelectorAll("[data-del]").forEach(el=> el.addEventListener("click",()=>{ if(confirm("Delete this exercise?")) removeExercise(el.dataset.del); }));
      on("expDet","click",exportDetail);
      on("bk","click",exportBackup);
      on("rs","click",importBackup);
      on("endTr","click",finishTraining);
    }
  }

  // PLAYERS view
  if(S.ui.view==="players"){
    document.querySelectorAll("[data-player]").forEach(el=> el.addEventListener("click",()=> showPlayerCard(el.dataset.player)));
    if(canEdit()){
      on("addP","click",()=>{
        const n=prompt("Player name (add several, separated by commas)");
        if(!n) return;
        n.split(",").map(x=>x.trim()).filter(Boolean).forEach(nm=> S.roster.push({id:uid(), name:nm}));
        save(); render();
      });
      document.querySelectorAll("[data-here]").forEach(el=> el.addEventListener("click",()=>{
        const id=el.dataset.here; const s=new Set(T().presentIds);
        s.has(id)?s.delete(id):s.add(id); T().presentIds=[...s]; save(); render();
      }));
      document.querySelectorAll("[data-start]").forEach(el=> el.addEventListener("change",()=>{
        S.startingPoints[el.dataset.start]=parseInt(el.value,10)||0; save();
      }));
      document.querySelectorAll("[data-renp]").forEach(el=> el.addEventListener("click",()=>{
        const p=S.roster.find(x=>x.id===el.dataset.renp); const n=prompt("Player name", p.name);
        if(n){ p.name=n.trim(); save(); render(); }
      }));
      document.querySelectorAll("[data-delp]").forEach(el=> el.addEventListener("click",()=>{
        const p=S.roster.find(x=>x.id===el.dataset.delp);
        if(!confirm("Remove "+p.name+"? They stay in already-banked trainings but leave the roster and all current teams.")) return;
        S.roster=S.roster.filter(x=>x.id!==p.id);
        delete S.startingPoints[p.id];
        T().presentIds=T().presentIds.filter(x=>x!==p.id);
        T().exercises.forEach(ex=> ex.teams.forEach(t=> t.playerIds=t.playerIds.filter(x=>x!==p.id)));
        save(); render();
      }));
    }
  }

  // STANDINGS view
  if(S.ui.view==="standings"){
    on("incToday","click",()=>{ S.ui.standingsIncludeToday=!S.ui.standingsIncludeToday; saveUi(); render(); });
    document.querySelectorAll("[data-player]").forEach(el=> el.addEventListener("click",()=> showPlayerCard(el.dataset.player)));
    document.querySelectorAll("[data-period]").forEach(el=> el.addEventListener("click",()=>{ S.ui.period=el.dataset.period; saveUi(); render(); }));
    on("wkPick","change",e=>{ S.ui.week=e.target.value; saveUi(); render(); });
    on("moPick","change",e=>{ S.ui.month=e.target.value; saveUi(); render(); });
    on("imgWeek","click",()=>exportStandingsImage("week"));
    on("imgMonth","click",()=>exportStandingsImage("month"));
    on("imgSeason","click",()=>exportStandingsImage("season"));
    on("expSum","click",exportSummary);
  }
}

document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(b) go(b.dataset.go);
});

render();
cloudInit();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
